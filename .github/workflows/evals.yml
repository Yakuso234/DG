name: Evals

# Agent-quality + safety/red-team evaluations. These call a real LLM and a
# seeded database, so they are deliberately kept OUT of the PR-blocking
# `tests.yml`: they run nightly and on manual dispatch only. Requires an
# OPENAI_API_KEY repository secret.

on:
  workflow_dispatch:
    inputs:
      pass_threshold:
        description: "Minimum overall score for the quality suites"
        default: "0.7"
  schedule:
    - cron: "0 7 * * *" # nightly 07:00 UTC

permissions:
  contents: read

jobs:
  evals:
    name: Agent quality + red-team
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce_secret
          POSTGRES_DB: ecommerce_agents
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ecommerce"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]

    env:
      DATABASE_URL: postgresql://ecommerce:ecommerce_secret@localhost:5432/ecommerce_agents
      REDIS_URL: redis://localhost:6379
      LLM_PROVIDER: openai
      LLM_MODEL: gpt-4.1
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # 'test' keeps the settings validator in warn-mode for placeholder secrets.
      ENVIRONMENT: test
      JWT_SECRET: ci-eval-jwt-secret-please-rotate-32bytes
      AGENT_SHARED_SECRET: ci-eval-agent-secret-please-rotate-32b
      AGENT_REGISTRY: "{}"
      THRESH: ${{ github.event.inputs.pass_threshold || '0.7' }}

    steps:
      - uses: actions/checkout@v4

      - name: Require OPENAI_API_KEY
        run: |
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "::error::OPENAI_API_KEY secret is not set — add it in repo settings to run evals."
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: agents/python/uv.lock

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        working-directory: agents/python
        run: uv sync --extra dev

      - name: Load database schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f docker/postgres/init.sql

      - name: Seed deterministic demo data
        working-directory: agents/python
        run: uv run python -m scripts.seed

      - name: Generate embeddings
        working-directory: agents/python
        run: uv run python -m scripts.generate_embeddings

      - name: Run quality + safety evals
        working-directory: agents/python
        run: |
          fail=0
          for a in product-discovery order-management pricing-promotions review-sentiment inventory-fulfillment; do
            ds="evals/datasets/${a//-/_}.json"
            echo "::group::quality eval — $a"
            uv run python -m evals.run_evals --agent "$a" --dataset "$ds" \
              --pass-threshold "$THRESH" --output-json "eval-$a.json" || fail=1
            echo "::endgroup::"
          done
          echo "::group::routing eval — orchestrator"
          uv run python -m evals.run_evals --agent orchestrator \
            --dataset evals/datasets/orchestrator_routing.json \
            --pass-threshold "$THRESH" --output-json eval-orchestrator.json || fail=1
          echo "::endgroup::"
          echo "::group::safety / red-team"
          uv run python -m evals.run_evals --suite safety \
            --pass-threshold 0.8 --output-json eval-safety.json || fail=1
          echo "::endgroup::"
          exit $fail

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: agents/python/eval-*.json
          retention-days: 30
